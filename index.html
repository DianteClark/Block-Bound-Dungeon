<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#140f1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Block Dungeon">
<meta name="description" content="A block-puzzle roguelike: clear lines to fight your way down five dungeon floors.">
<title>Block Bound Dungeon</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/lilita-one-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/fredoka-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles/main.css">
<!-- fetch every module in parallel instead of discovering them one import at a time -->
<link rel="modulepreload" href="src/main.js">
<link rel="modulepreload" href="src/art/heroes.js">
<link rel="modulepreload" href="src/art/icons.js">
<link rel="modulepreload" href="src/art/index.js">
<link rel="modulepreload" href="src/art/items.js">
<link rel="modulepreload" href="src/art/kit.js">
<link rel="modulepreload" href="src/art/monsters.js">
<link rel="modulepreload" href="src/audio/audio.js">
<link rel="modulepreload" href="src/core/rng.js">
<link rel="modulepreload" href="src/core/store.js">
<link rel="modulepreload" href="src/data/blocks.js">
<link rel="modulepreload" href="src/data/enemies.js">
<link rel="modulepreload" href="src/data/events.js">
<link rel="modulepreload" href="src/data/heroes.js">
<link rel="modulepreload" href="src/data/potions.js">
<link rel="modulepreload" href="src/data/relics.js">
<link rel="modulepreload" href="src/data/rules.js">
<link rel="modulepreload" href="src/data/shapes.js">
<link rel="modulepreload" href="src/engine/board.js">
<link rel="modulepreload" href="src/engine/combat.js">
<link rel="modulepreload" href="src/engine/run.js">
<link rel="modulepreload" href="src/engine/stats.js">
<link rel="modulepreload" href="src/ui/app.js">
<link rel="modulepreload" href="src/ui/combat.js">
<link rel="modulepreload" href="src/ui/dom.js">
<link rel="modulepreload" href="src/ui/screens.js">
<link rel="modulepreload" href="src/ui/sheets.js">
</head>
<body>
<div id="bg" aria-hidden="true"></div>
<main id="app">
  <header id="runbar" hidden></header>
  <section id="screen"></section>
</main>
<div id="fx" aria-hidden="true"></div>
<div id="sheet" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<noscript>Block Bound Dungeon needs JavaScript to run.</noscript>
<script type="module" src="src/main.js"></script>
</body>
</html>
