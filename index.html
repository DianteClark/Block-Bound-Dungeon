<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#120f17">
<title>Block Bound Dungeon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#120f17; --panel:#1d1824; --panel2:#262030; --line:#3a3046;
  --text:#eae3f2; --muted:#9a8fab; --torch:#ff9d3c; --torch2:#ffcf7a;
  --sword:#e5484d; --shield:#3e8ef7; --heal:#3dbb6a; --coin:#f2c230; --venom:#9d4edd;
  --display:'Pixelify Sans', ui-monospace, monospace;
  --body: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--body);overscroll-behavior:none}
body{background:radial-gradient(ellipse at 50% -10%, #2a1d33 0%, var(--bg) 60%) fixed}
button{font:inherit;color:inherit}
.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block;flex:none}
#app{max-width:460px;margin:0 auto;padding:10px 12px calc(16px + env(safe-area-inset-bottom));min-height:100%;display:flex;flex-direction:column;gap:10px}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;letter-spacing:.5px}
p{margin:0}

/* run bar */
#runbar{display:flex;flex-direction:column;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 10px}
.rb-top{display:flex;align-items:center;gap:9px;font-family:var(--display);font-size:17px}
.rb-top .floor{margin-left:auto;color:var(--muted);font-size:13px;white-space:nowrap}
.inline{display:flex;align-items:center;gap:4px}
.hpbar{position:relative;height:16px;background:#2c1418;border-radius:8px;overflow:hidden;flex:1;min-width:70px}
.hpbar > i{position:absolute;inset:0 auto 0 0;background:linear-gradient(#ff6a6f,var(--sword));border-radius:8px;transition:width .3s}
.hpbar > span{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:700;text-shadow:0 1px 2px #000;font-family:var(--body)}
.rb-items{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.slots{display:flex;gap:4px}
.slot,.relic{width:30px;height:30px;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:7px;cursor:pointer;padding:0}
.slot.empty{border-style:dashed;opacity:.45;cursor:default}
.slot.sel{border-color:var(--torch);box-shadow:0 0 8px var(--torch)}
.relic.used{opacity:.3}
.sep{width:1px;height:22px;background:var(--line);margin:0 2px}
.relics{display:flex;flex-wrap:wrap;gap:4px}

/* screens */
.screen{display:flex;flex-direction:column;gap:12px;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.btn{display:block;width:100%;padding:13px 14px;border-radius:12px;border:1px solid #6a4a2a;background:linear-gradient(#ffae55,#e07a1f);color:#2a1606;font-family:var(--display);font-size:18px;font-weight:700;cursor:pointer;box-shadow:0 3px 0 #8a4810}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #8a4810}
.btn.ghost{background:var(--panel2);color:var(--text);border-color:var(--line);box-shadow:0 3px 0 #0b0910}
.choice{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;box-shadow:0 3px 0 #0b0910}
.choice:active{transform:translateY(2px);box-shadow:none}
.choice .ic{width:52px;height:52px;display:grid;place-items:center;background:var(--panel2);border-radius:10px;flex:none}
.choice b{font-family:var(--display);font-size:18px;display:block}
.choice small{color:var(--muted);font-size:13px;line-height:1.35;display:block}
.choice .price{margin-left:auto;font-family:var(--display);color:var(--coin);font-size:17px;flex:none;display:flex;align-items:center;gap:3px}
.choice:disabled{opacity:.4;pointer-events:none}
.choice .rar{font-size:11px;font-family:var(--body);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.rar1{color:#b8b0c4}.rar2{color:#8dbcff}.rar3{color:#ffcf7a}
.muted{color:var(--muted)}
.center{text-align:center}
.scene{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.scene .art{width:112px;height:112px;display:grid;place-items:center;background:radial-gradient(circle,#3a2c48,#1d1824 70%);border-radius:50%;margin-bottom:4px}

/* title */
.logo{font-size:40px;line-height:1;text-align:center;color:var(--torch2);text-shadow:0 0 18px rgba(255,157,60,.45),0 3px 0 #7a3a0a;margin-top:8px}
.heroes{display:flex;justify-content:center;gap:10px;margin-top:14px}
.how{margin:0;padding-left:18px;line-height:1.5;font-size:14px;color:#d4cbe0}
.how li{margin:4px 0}
.chip{display:inline-block;padding:0 6px;border-radius:5px;font-weight:700;color:#fff;font-size:13px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:13px;margin-top:8px}
.legend span{display:flex;align-items:center;gap:6px}
.blk{width:18px;height:18px;border-radius:4px;display:grid;place-items:center;flex:none}

/* hero select */
.hero{align-items:flex-start}
.hero .ic{width:72px;height:72px}
.hero .stats{display:flex;gap:10px;margin-top:4px;font-size:13px;color:#d4cbe0}

/* map */
.steps{display:flex;gap:5px;justify-content:center;margin:2px 0 4px}
.steps i{width:22px;height:8px;border-radius:4px;background:var(--panel2);border:1px solid var(--line)}
.steps i.done{background:#6b4f80}
.steps i.now{background:var(--torch);box-shadow:0 0 8px var(--torch)}
.steps i.boss{width:30px;background:#5a2020}

/* combat */
#combat{display:flex;flex-direction:column;gap:8px}
#enemyPanel{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
#eArt{width:72px;height:72px;display:grid;place-items:center;background:radial-gradient(circle,#4a3a5c,#1d1824 72%);border-radius:50%;flex:none}
.einfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.ename{font-family:var(--display);font-size:18px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tag{font-size:10px;padding:1px 6px;border-radius:5px;background:#5a2a6a;color:#f2d7ff;font-family:var(--body);font-weight:700;text-transform:uppercase}
.tag.boss{background:#7a2020;color:#ffd6d6}
.tag.pass{background:#2a3a5a;color:#cfe0ff;cursor:pointer}
.erow{display:flex;gap:6px;align-items:center}
.ebar > i{background:linear-gradient(#c58cff,#8a3fd1)}
.badge{display:flex;align-items:center;gap:3px;font-size:13px;font-weight:700;padding:1px 6px 1px 3px;border-radius:7px;background:var(--panel2);white-space:nowrap;cursor:pointer}
#intent{display:flex;align-items:center;gap:7px;font-size:14px;cursor:pointer;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:3px 8px 3px 4px;align-self:flex-start}
#intent .val{font-family:var(--display);font-size:16px}
#intent .cd{color:var(--muted);font-size:12px}
#intent.urgent{border-color:var(--sword);box-shadow:0 0 10px rgba(229,72,77,.5)}
#intent.urgent .cd{color:#ff9a9d;font-weight:700}
#playerPanel{display:flex;gap:8px;align-items:center}
#playerPanel .stat{display:flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:4px 9px 4px 5px;font-family:var(--display);font-size:16px;cursor:pointer}
#rerollBtn{margin-left:auto;display:flex;align-items:center;gap:5px;padding:4px 10px 4px 6px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);font-family:var(--display);font-size:16px;cursor:pointer}
#rerollBtn:disabled{opacity:.35}
#board{display:block;margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none}
.shake{animation:shake .32s}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-6px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-4px,1px)}80%{transform:translate(3px,0)}}
.hitflash{animation:hitflash .35s}
@keyframes hitflash{0%{filter:none}30%{filter:brightness(2.4) saturate(0)}100%{filter:none}}
.float{position:fixed;z-index:50;pointer-events:none;font-family:var(--display);font-weight:700;font-size:22px;text-shadow:0 2px 0 #000,0 0 8px rgba(0,0,0,.8);transform:translate(-50%,-50%);animation:floatup 1s ease-out forwards;white-space:nowrap}
.float.big{font-size:32px;color:var(--torch2)}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#2d2538;border:1px solid var(--line);color:var(--text);padding:10px 14px;border-radius:12px;font-size:14px;max-width:min(420px,90vw);opacity:0;pointer-events:none;transition:.2s;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.5);display:flex;gap:10px;align-items:center}
#toast.on{opacity:1;transform:translateX(-50%)}
#toast b{font-family:var(--display);font-size:16px}
.stats3{display:flex;justify-content:space-around;text-align:center;font-family:var(--display);font-size:20px}
.stats3 small{display:block;color:var(--muted);font-size:12px;font-family:var(--body)}
</style>
</head>
<body>
<div id="app">
  <header id="runbar" hidden>
    <div class="rb-top">
      <span id="heroIcon"></span>
      <div class="hpbar"><i id="hpFill"></i><span id="hpText"></span></div>
      <span class="inline" id="goldWrap"><span id="coinIcon"></span><b id="goldText">0</b></span>
      <span class="floor" id="floorText"></span>
    </div>
    <div class="rb-items">
      <div class="slots" id="potionBar"></div>
      <div class="sep"></div>
      <div class="relics" id="relicBar"></div>
    </div>
  </header>

  <main id="view"></main>

  <section id="combat" hidden>
    <div id="enemyPanel">
      <div id="eArt"></div>
      <div class="einfo">
        <div class="ename"><span id="eName"></span><span id="eTags"></span></div>
        <div class="erow">
          <div class="hpbar ebar"><i id="eHpFill"></i><span id="eHpText"></span></div>
          <span id="eBadges" style="display:flex;gap:4px"></span>
        </div>
        <div id="intent"></div>
      </div>
    </div>
    <div id="playerPanel">
      <span class="stat" id="shieldStat"><span id="shieldIcon"></span><span id="shieldText">0</span></span>
      <span class="stat" id="comboStat"><span id="flameIcon"></span><span id="streakText">-</span></span>
      <button id="rerollBtn"><span id="diceIcon"></span><span id="rerollText">1</span></button>
    </div>
    <canvas id="board"></canvas>
  </section>
</div>
<div id="toast"></div>

<script src="sprites.js"></script>
<script src="game.js"></script>
</body>
</html>
