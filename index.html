<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#110c16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Block Dungeon">
<title>Block Bound Dungeon</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  --bg:#110c16; --panel:rgba(26,20,33,.92); --panel2:#2a2235; --line:#43384f; --line2:#5a4c6a;
  --text:#f1eaf8; --muted:#a397b4; --torch:#ff9d3c; --torch2:#ffcf7a;
  --sword:#e5484d; --shield:#3e8ef7; --heal:#3dbb6a; --coin:#f2c230; --venom:#9d4edd;
  --display:'Lilita One', 'Arial Rounded MT Bold', system-ui, sans-serif;
  --body: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --stk: 0 0 0 #fff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--body);overscroll-behavior:none}
body{background-color:#140f1a;background-size:160px 96px}
button{font:inherit;color:inherit}
.stk{display:block;flex:none;-webkit-user-drag:none;user-select:none;image-rendering:auto}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;letter-spacing:.5px}
p{margin:0}

/* ---------- dungeon atmosphere ---------- */
#atmo{position:fixed;inset:0;pointer-events:none;z-index:0}
#atmo .shade{position:absolute;inset:0;background:
  radial-gradient(ellipse 120% 80% at 50% 0%, rgba(80,40,100,.25), transparent 60%),
  linear-gradient(180deg, rgba(10,6,14,.35), rgba(10,6,14,.75))}
.torch{position:absolute;top:18%;width:420px;height:420px;border-radius:50%;
  background:radial-gradient(circle, rgba(255,150,60,.30) 0%, rgba(255,120,40,.12) 35%, transparent 68%);
  animation:flicker 2.6s infinite ease-in-out; mix-blend-mode:screen}
.torch.l{left:-230px}.torch.r{right:-230px;animation-delay:-1.3s;animation-duration:3.1s}
@keyframes flicker{0%,100%{opacity:.85;transform:scale(1)}20%{opacity:1;transform:scale(1.04)}35%{opacity:.7}50%{opacity:.95;transform:scale(.98)}70%{opacity:.78}85%{opacity:1;transform:scale(1.03)}}
#embers{position:absolute;inset:0;width:100%;height:100%}
#atmo .vig{position:absolute;inset:0;background:radial-gradient(ellipse 85% 75% at 50% 45%, transparent 55%, rgba(0,0,0,.75) 100%)}
#flash{position:fixed;inset:0;pointer-events:none;z-index:70;opacity:0}
#flash.on{animation:flash .45s ease-out}
@keyframes flash{0%{opacity:.55}100%{opacity:0}}

#app{position:relative;z-index:1;max-width:460px;margin:0 auto;padding:calc(10px + var(--sat)) 12px calc(16px + var(--sab));min-height:100vh;display:flex;flex-direction:column;gap:10px}

/* ---------- panels ---------- */
.panel,#runbar,.card,.choice,#enemyPanel{background:var(--panel);border:2px solid var(--line);border-radius:16px;box-shadow:0 5px 0 rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06)}
#runbar{display:flex;flex-direction:column;gap:6px;padding:7px 10px;position:relative;z-index:20;background:rgba(26,20,33,.97)}
html:not(.lock) #runbar{position:sticky;top:calc(6px + var(--sat))}
html.lock,html.lock body{overflow:hidden;height:100%;overscroll-behavior:none}
html.lock #app{position:fixed;top:0;left:0;right:0;margin:0 auto;height:var(--appH,100vh);min-height:0;overflow:hidden;padding-bottom:calc(8px + var(--sab))}
.rb-top{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:18px}
.rb-top .floor{color:var(--muted);font-size:14px;white-space:nowrap}
.inline{display:flex;align-items:center;gap:3px}
.hpbar{position:relative;height:18px;background:#2c1418;border:2px solid #120c16;border-radius:10px;overflow:hidden;flex:1;min-width:60px}
.hpbar > i{position:absolute;inset:0 auto 0 0;background:linear-gradient(#ff7a7f,#e5484d 55%,#b8323a);border-radius:8px;transition:width .35s cubic-bezier(.3,1.4,.5,1)}
.hpbar > i::after{content:'';position:absolute;left:4px;right:4px;top:2px;height:4px;border-radius:3px;background:rgba(255,255,255,.35)}
.hpbar > span{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-family:var(--display);text-shadow:0 1px 0 #000,0 0 3px #000}
.rb-items{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;min-width:0}
.slots{display:flex;gap:4px}
.slot,.relic,.iconbtn{width:32px;height:32px;display:grid;place-items:center;background:var(--panel2);border:2px solid var(--line);border-radius:9px;cursor:pointer;padding:0}
.slot.empty{border-style:dashed;opacity:.4;cursor:default}
.slot.sel{border-color:var(--torch);box-shadow:0 0 10px var(--torch)}
.relic.used{opacity:.3}
.iconbtn{background:transparent;border-color:transparent}
.sep{width:2px;height:22px;background:var(--line);margin:0 2px;border-radius:2px}
.relics{display:flex;flex-wrap:nowrap;gap:4px;overflow-x:auto;overflow-y:hidden;flex:1;min-width:0;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent);padding-right:14px}
.relics::-webkit-scrollbar{display:none}
.relic,.slot{flex:none}
#relicCount{flex:none;font-family:var(--display);font-size:13px;color:var(--muted);background:var(--panel2);border:2px solid var(--line);border-radius:9px;padding:4px 7px;cursor:pointer}

/* ---------- screens & buttons ---------- */
.screen{display:flex;flex-direction:column;gap:12px;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{padding:14px}
.btn{display:block;width:100%;padding:12px 14px;border-radius:16px;border:3px solid #fff;background:linear-gradient(#ffb15c,#f07f1f 60%,#d8650c);color:#3a1b02;font-family:var(--display);font-size:22px;letter-spacing:.5px;cursor:pointer;box-shadow:0 5px 0 #1a0f08, 0 8px 16px rgba(0,0,0,.4);text-shadow:0 1px 0 rgba(255,255,255,.4)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #1a0f08}
.btn.ghost{background:linear-gradient(#3a3047,#2a2235);color:var(--text);border-color:var(--line2);box-shadow:0 5px 0 #0a070d;text-shadow:none}
.btn.danger{background:linear-gradient(#ff6a6f,#c73036);color:#fff;text-shadow:0 1px 0 #000}
.choice{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:10px 12px;cursor:pointer;transition:transform .1s}
.choice:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.45)}
.choice .ic{width:58px;height:58px;display:grid;place-items:center;background:radial-gradient(circle,#3d3150,#221b2b 75%);border-radius:14px;flex:none}
.choice b{font-family:var(--display);font-size:20px;font-weight:400;display:block;letter-spacing:.3px}
.choice small{color:var(--muted);font-size:13px;line-height:1.35;display:block}
.choice .price{margin-left:auto;font-family:var(--display);color:var(--coin);font-size:19px;flex:none;display:flex;align-items:center;gap:2px}
.choice:disabled{opacity:.4;pointer-events:none}
.rar{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px}
.rar1{color:#c4bcd0}.rar2{color:#8dbcff}.rar3{color:#ffcf7a}.rar4{color:#ff8a8d}
.muted{color:var(--muted)}
.center{text-align:center}
.scene{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.scene .art{width:132px;height:132px;display:grid;place-items:center;background:radial-gradient(circle,#4a3a5c,rgba(29,24,36,0) 70%);border-radius:50%}
.scene .art .stk{animation:bob 3s ease-in-out infinite}
.title{font-family:var(--display);font-size:30px;color:#fff;text-shadow:0 3px 0 #000}

/* sticker headline text */
.logo{font-family:var(--display);font-size:46px;line-height:.95;text-align:center;color:var(--torch2);margin-top:6px;transform:rotate(-3deg);text-shadow:3.50px 0.00px 0 #fff,3.38px 0.91px 0 #fff,3.03px 1.75px 0 #fff,2.47px 2.47px 0 #fff,1.75px 3.03px 0 #fff,0.91px 3.38px 0 #fff,0.00px 3.50px 0 #fff,-0.91px 3.38px 0 #fff,-1.75px 3.03px 0 #fff,-2.47px 2.47px 0 #fff,-3.03px 1.75px 0 #fff,-3.38px 0.91px 0 #fff,-3.50px 0.00px 0 #fff,-3.38px -0.91px 0 #fff,-3.03px -1.75px 0 #fff,-2.47px -2.47px 0 #fff,-1.75px -3.03px 0 #fff,-0.91px -3.38px 0 #fff,-0.00px -3.50px 0 #fff,0.91px -3.38px 0 #fff,1.75px -3.03px 0 #fff,2.47px -2.47px 0 #fff,3.03px -1.75px 0 #fff,3.38px -0.91px 0 #fff,2.00px 0.00px 0 #fff,1.73px 1.00px 0 #fff,1.00px 1.73px 0 #fff,0.00px 2.00px 0 #fff,-1.00px 1.73px 0 #fff,-1.73px 1.00px 0 #fff,-2.00px 0.00px 0 #fff,-1.73px -1.00px 0 #fff,-1.00px -1.73px 0 #fff,-0.00px -2.00px 0 #fff,1.00px -1.73px 0 #fff,1.73px -1.00px 0 #fff,0 9px 0 rgba(0,0,0,.55)}
.logo span{display:block;color:#ff8a3c}
.logo span+span{color:#c77dff;font-size:54px}
.heroes{display:flex;justify-content:center;gap:6px;margin-top:10px}
.heroes .stk:nth-child(1){transform:rotate(-8deg)}
.heroes .stk:nth-child(3){transform:rotate(8deg)}
.heroes .stk{animation:bob 3s ease-in-out infinite}
.heroes .stk:nth-child(2){animation-delay:-1s}.heroes .stk:nth-child(3){animation-delay:-2s}
.how{margin:0;padding-left:18px;line-height:1.5;font-size:14px;color:#ddd3e8}
.how li{margin:4px 0}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:13px;margin-top:8px}
.legend span{display:flex;align-items:center;gap:6px}
.blk{width:22px;height:22px;flex:none}
.titlebar{display:flex;justify-content:space-between}

/* hero select */
.hero{align-items:flex-start}
.roster{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rpick{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px 5px;background:var(--panel);border:2px solid var(--line);border-radius:12px;color:var(--text);font:10.5px/1.1 var(--body);font-weight:700;letter-spacing:-.01em;cursor:pointer;min-width:0}
.hdetail .mastery{width:100%}
.hdetail .mastery .qbar{width:100%}
.rpick span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rpick.on{border-color:var(--torch2);background:var(--panel2);box-shadow:0 0 0 2px rgba(255,207,122,.35)}
.rpick.locked img{filter:grayscale(1) brightness(.45)}
.rpick.locked span{color:var(--muted)}
.rpick .rwin{position:absolute;top:4px;right:5px;width:8px;height:8px;border-radius:50%;background:#ffd23f;border:1.5px solid #1d1424}
.hdetail{display:flex;flex-direction:column;gap:6px}
.hdetail .hd-top{display:flex;gap:10px;align-items:center}
.hdetail .hname{font-family:var(--display);font-size:22px;font-weight:400;display:block}
.hdetail .btn{margin-top:4px}
@media (max-width:370px){ .roster{grid-template-columns:repeat(4,1fr)} }
.hero .ic{width:78px;height:78px}
.hero .stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:5px;font-size:13px;color:#ddd3e8}
.hero .ult{margin-top:5px;font-size:12px;color:#ffcf7a}

/* map */
.steps{display:flex;gap:5px;justify-content:center;margin:2px 0 4px}
.steps i{width:22px;height:10px;border-radius:5px;background:var(--panel2);border:2px solid var(--line)}
.steps i.done{background:#7a5a96;border-color:#9a7ab6}
.steps i.now{background:var(--torch);border-color:#fff;box-shadow:0 0 10px var(--torch)}
.steps i.boss{width:32px;background:#5a2020}

/* ---------- combat ---------- */
#app > *{flex-shrink:0}
#combat{display:flex;flex-direction:column;gap:8px;flex:1 1 auto;min-height:0}
#combat > *{flex-shrink:0}
#enemyPanel{display:flex;gap:10px;align-items:center;padding:8px 12px 8px 8px;overflow:hidden;position:relative}
#enemyPanel::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 50% 90% at 14% 60%, rgba(255,140,60,.12), transparent 70%);pointer-events:none}
.eart{width:96px;height:96px;display:grid;place-items:center;position:relative;flex:none}
.eart::after{content:'';position:absolute;bottom:6px;left:18px;right:18px;height:10px;border-radius:50%;background:rgba(0,0,0,.5);filter:blur(2px);z-index:-1}
.eart .stk{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.eart.squash .stk{animation:squash .34s cubic-bezier(.3,1.5,.5,1)}
@keyframes squash{0%{transform:none}22%{transform:scale(calc(1 + var(--sq,.1)), calc(1 - var(--sq,.1))) translateX(6px);filter:brightness(1.9) saturate(.5)}55%{transform:scale(calc(1 - var(--sq,.1)/2), calc(1 + var(--sq,.1)/2))}100%{transform:none}}
.eart.killshot .stk{animation:killshot 1s ease-out forwards!important}
@keyframes killshot{0%{transform:scale(1)}15%{transform:scale(1.35) rotate(-6deg);filter:brightness(2.4)}60%{transform:scale(1.15) rotate(4deg);filter:brightness(1.4)}100%{transform:scale(.2) rotate(30deg) translateY(30px);opacity:0}}
#board.finisher{animation:finisher .9s ease-out}
@keyframes finisher{0%{transform:scale(1)}20%{transform:scale(1.025)}100%{transform:scale(1)}}
#announcer{position:fixed;z-index:40;pointer-events:none;text-align:center;opacity:0;display:flex;flex-direction:column;align-items:center}
#announcer b{font-family:var(--display);font-weight:400;line-height:1;-webkit-text-stroke:2px #120c16;paint-order:stroke fill;text-shadow:0 4px 0 rgba(0,0,0,.5)}
#announcer small{font:800 12px var(--body);letter-spacing:.12em;text-transform:uppercase;color:#fff;-webkit-text-stroke:0;text-shadow:0 2px 0 #000;margin-top:2px}
#announcer.go{animation:announce 1s ease-out forwards}
@keyframes announce{0%{opacity:0;transform:scale(.4) rotate(-6deg)}15%{opacity:1;transform:scale(1.15) rotate(2deg)}30%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-30px) scale(.95)}}
body.slowmo .float{animation-duration:2.6s!important}
@media (prefers-reduced-motion: reduce){ #announcer.go{animation-duration:.01s} }
.eart.lunge .stk{animation:lunge .35s ease-out}
@keyframes lunge{0%{transform:none}35%{transform:translate(14px,6px) scale(1.15) rotate(6deg)}100%{transform:none}}
.eart.dead .stk{animation:peel .8s ease-in forwards}
@keyframes peel{0%{transform:none}30%{transform:rotate(-10deg) scale(1.1)}100%{transform:translate(30px,-60px) rotate(40deg) scale(.4);opacity:0}}
.ecard{display:flex;gap:10px;align-items:center;flex:1;min-width:0;position:relative;transition:opacity .4s, filter .4s}
#enemyPanel.multi{gap:6px;padding:6px}
#enemyPanel.multi .ecard{display:grid;grid-template-columns:44px 1fr;grid-template-rows:auto auto auto;gap:3px 6px;align-items:center;background:rgba(0,0,0,.18);border-radius:12px;padding:5px 6px}
#enemyPanel.multi .einfo{display:contents}
#enemyPanel.multi .eart{width:44px;height:44px;grid-row:1 / span 2;grid-column:1}
#enemyPanel.multi .eart::after{left:8px;right:8px;bottom:0}
#enemyPanel.multi .ename{grid-column:2;grid-row:1;font-size:14px;flex-wrap:nowrap;min-width:0}
#enemyPanel.multi .enm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#enemyPanel.multi .etags{display:none}
#enemyPanel.multi .erow{grid-column:2;grid-row:2;min-width:0}
#enemyPanel.multi .ebar{height:16px;font-size:11px}
#enemyPanel.multi .intent{grid-column:1 / span 2;grid-row:3;justify-self:start;padding:0 7px 0 2px}
#enemyPanel.multi .intent .val{font-size:15px}
#enemyPanel.multi .intent .cd{font-size:11px}
#enemyPanel.multi .lane{grid-column:1 / span 2;grid-row:3;justify-self:end;align-self:center;writing-mode:horizontal-tb;line-height:1.1;text-align:right;max-width:52px}
.ecard.gone{opacity:.35;filter:grayscale(1)}
.ecard.gone .intent{display:none}
.lane{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center}
.ebadges{display:flex;gap:4px}
.einfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;position:relative}
.ename{font-family:var(--display);font-size:20px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;line-height:1}
.tag{font-size:10px;padding:2px 6px;border-radius:6px;background:#5a2a6a;color:#f2d7ff;font-family:var(--body);font-weight:800;text-transform:uppercase;letter-spacing:.4px}
.tag.boss{background:#8a2020;color:#ffe0e0}
.tag.pass{background:#2a3a5a;color:#cfe0ff;cursor:pointer}
.erow{display:flex;gap:6px;align-items:center}
.ebar > i{background:linear-gradient(#d9a8ff,#9a4fe0 55%,#6f2fb0)}
.badge{display:flex;align-items:center;gap:1px;font-family:var(--display);font-size:15px;padding:0 6px 0 0;border-radius:8px;background:var(--panel2);white-space:nowrap;cursor:pointer}
.intent{display:flex;align-items:center;gap:6px;cursor:pointer;background:var(--panel2);border:2px solid var(--line);border-radius:10px;padding:1px 9px 1px 2px;align-self:flex-start}
.intent .val{font-family:var(--display);font-size:19px}
.intent .cd{color:var(--muted);font-size:12px;font-weight:600}
.intent.urgent{border-color:var(--sword);animation:pulse 1s infinite}
.intent.urgent .cd{color:#ff9a9d;font-weight:800}
@keyframes pulse{0%,100%{box-shadow:0 0 0 rgba(229,72,77,0)}50%{box-shadow:0 0 14px rgba(229,72,77,.8)}}
#playerPanel{display:flex;gap:7px;align-items:center}
.stat{display:flex;align-items:center;gap:2px;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:1px 10px 1px 2px;font-family:var(--display);font-size:19px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.4)}
#rerollBtn{display:flex;align-items:center;gap:2px;padding:1px 10px 1px 2px;border-radius:12px;border:2px solid var(--line);background:var(--panel2);font-family:var(--display);font-size:19px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.4)}
#rerollBtn:disabled{opacity:.35}
#ultBtn{margin-left:auto;position:relative;width:54px;height:54px;border-radius:50%;border:3px solid #fff;padding:0;cursor:pointer;display:grid;place-items:center;
  background:conic-gradient(var(--torch) calc(var(--p,0)*1%), #2a2235 0);box-shadow:0 4px 0 #000}
#ultBtn::before{content:'';position:absolute;inset:4px;border-radius:50%;background:radial-gradient(circle,#3d3150,#1d1724)}
#ultBtn .stk{position:relative}
#ultBtn.ready{animation:ready 1.1s infinite}
#heroIcon{position:relative;cursor:pointer}
#heroIcon .lvb{position:absolute;right:-6px;bottom:-4px;min-width:17px;height:17px;padding:0 3px;border-radius:9px;background:#ffd23f;color:#1d1424;border:2px solid #1d1424;font:12px/13px var(--display);text-align:center}
.hpbar > #xpFill{position:absolute;left:0;bottom:0;top:auto;height:3px;background:#ffd23f;border-radius:0;transition:width .5s;z-index:2}
.hpbar > #xpFill::after{display:none}
#ultBtn.sealed{filter:grayscale(1) brightness(.7);animation:none}
#ultBtn.sealed::after{content:'';position:absolute;inset:-3px;border-radius:50%;background:repeating-linear-gradient(45deg,transparent 0 7px,rgba(255,80,90,.55) 7px 10px);pointer-events:none}
@keyframes ready{0%,100%{box-shadow:0 4px 0 #000,0 0 0 rgba(255,157,60,0)}50%{box-shadow:0 4px 0 #000,0 0 22px rgba(255,180,80,1)}}
#ultBtn small{position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);background:#000;border-radius:6px;padding:0 5px;font-family:var(--display);font-size:11px;white-space:nowrap}
#board{display:block;margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none}
.hint{text-align:center;color:var(--muted);font-size:12px;margin-top:-4px}
.shake{animation:shake .32s}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-7px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,0)}}
.hitflash .stk{filter:brightness(2.5) saturate(0)}

.float{position:fixed;z-index:50;pointer-events:none;font-family:var(--display);font-size:26px;color:#fff;

#toast{z-index:95}
.setinfo{border:2px solid var(--sc);border-radius:12px;padding:8px 10px;font-size:13px;background:#1d1724;margin-top:4px}
.setinfo b{display:block;font-family:var(--display);font-weight:400;font-size:15px;color:var(--sc)}
.setinfo small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
button.setpill{font:inherit;font-family:var(--display);font-size:14px}

.bagrows{display:flex;flex-direction:column;gap:6px}
.bagrow{display:grid;grid-template-columns:24px 78px 1fr 26px 34px;align-items:center;gap:6px;font-size:13px}
.bagrow b{font-family:var(--display);font-weight:400;font-size:16px}
.bagbar{height:10px;background:#2a2235;border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.bagbar i{display:block;height:100%}
.bagn{font-family:var(--display);font-size:17px;text-align:right}
.bagrow small{color:var(--muted);text-align:right}
.blockpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.bpick{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 6px;border-radius:14px;border:2px solid var(--line);background:var(--panel2);cursor:pointer}
.bpick .blk{width:34px;height:34px}
.bpick b{font-family:var(--display);font-weight:400;font-size:16px}
.bpick small{color:var(--muted);font-size:11px}
#bagBtn{flex:none}

.bagmini{display:flex;gap:8px;margin-top:4px}
.bagmini span{display:flex;align-items:center;gap:2px;font-family:var(--display);font-size:14px}
.bagmini .blk{width:16px;height:16px}
</style>
</head>
<body>
<div id="atmo"><div class="shade"></div><div class="torch l"></div><div class="torch r"></div><canvas id="embers"></canvas><div class="vig"></div></div>
<div id="flash"></div>
<div id="app">
  <header id="runbar" hidden>
    <div class="rb-top">
      <span id="heroIcon"></span>
      <div class="hpbar"><i class="trail" id="hpTrail"></i><i id="hpFill"></i><span id="hpText"></span><i id="xpFill" aria-hidden="true"></i></div>
      <span class="inline" id="goldWrap"><span id="coinIcon"></span><b id="goldText">0</b></span>
      <span class="floor" id="floorText"></span>
      <button class="iconbtn" id="gearBtn" aria-label="Settings"></button>
    </div>
    <div class="rb-items">
      <button class="slot" id="bagBtn" aria-label="Block bag"></button>
      <div class="slots" id="potionBar"></div>
      <div class="sep"></div>
      <div class="relics" id="relicBar"></div>
      <button id="relicCount" aria-label="All relics"></button>
    </div>
  </header>

  <main id="view"></main>

  <section id="combat" hidden>
    <div id="enemyPanel"></div>
    <div id="playerPanel">
      <span class="stat" id="shieldStat"><span id="shieldIcon"></span><span id="shieldText">0</span></span>
      <span class="stat" id="comboStat"><span id="flameIcon"></span><span id="streakText">-</span></span>
      <span id="petWrap"></span>
      <button id="rerollBtn"><span id="diceIcon"></span><span id="rerollText">1</span></button>
      <button id="ultBtn"><span id="ultIcon"></span><small id="ultText"></small></button>
    </div>
    <canvas id="board"></canvas>
    <div class="hint" id="hint">Tap a piece to rotate it. Drag to place.</div>
  </section>
</div>
<div id="modal" hidden></div>
<div id="banner" hidden></div>
<canvas id="fxc"></canvas>
<div id="toast"></div>

<script src="art.js"></script>
<script src="audio.js"></script>
<script src="game.js"></script>
<script>
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
